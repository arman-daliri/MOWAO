[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mowao"
version = "0.0.2"
authors = [
  { name="Arman Daliri", email="daliriwork2@gmail.com" },
]
maintainers = [
  { name="Mohammad Mahdi Mir", email="m.m.mir83hc@gmail.com" },
]
description = "Multi-objective WAO algorithm"
readme = "src/README.md"
requires-python = ">=3.12"
classifiers = [
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
source = "https://github.com/arman-daliri/MOWAO"

[tool.cibuildwheel]
before-all = "uname -a"
skip = ["*-musllinux_x86_64"]
